services:
  redis:
    image: redis:7-alpine
    container_name: ai_search_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_search_qdrant
    ports:
      - "6333:6333"   # REST + gRPC
      - "6334:6334"   # gRPC (optional)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL is hosted on Supabase — no local container needed.
  # Connection string goes in .env as DATABASE_URL.

  # --- Uncomment below to run the backend in Docker too ---
  # backend:
  #   build: .
  #   container_name: ai_search_backend
  #   ports:
  #     - "8000:8000"
  #   env_file:
  #     - .env
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #     qdrant:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
